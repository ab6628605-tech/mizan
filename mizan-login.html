<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MIZAN · دخول</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090E;--gold:#C9A961;--gb:#E8CE8B;--copper:#B87333;--tx:#EDEDED;--td:#7A8090;--tm:#4A5060;--em:#6EE7A0;--rose:#F0A0B0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:300;display:flex;align-items:center;justify-content:center;position:relative}

.aura{position:fixed;inset:0;pointer-events:none;z-index:0;background:
radial-gradient(ellipse 80% 50% at 50% -20%,rgba(201,169,97,.12),transparent 60%),
radial-gradient(ellipse 60% 40% at 100% 100%,rgba(157,196,232,.06),transparent 60%)}

.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

.wrap{position:relative;z-index:2;width:100%;max-width:420px;padding:32px 24px;animation:pageIn .8s cubic-bezier(.16,1,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.logo-wrap{text-align:center;margin-bottom:36px}
.logo-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(135deg,rgba(201,169,97,.15),rgba(201,169,97,.03));border:1px solid rgba(201,169,97,.28);display:flex;align-items:center;justify-content:center;color:var(--gb);box-shadow:0 20px 60px -20px rgba(201,169,97,.5);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.logo-brand{font-family:'Inter',sans-serif;font-size:26px;letter-spacing:.35em;color:var(--gb);font-weight:300;margin-bottom:6px}
.logo-sub{font-size:10px;letter-spacing:.35em;color:var(--tm);text-transform:uppercase;font-weight:500}

.form-card{background:linear-gradient(160deg,rgba(255,255,255,.03),rgba(255,255,255,.005));border:1px solid rgba(201,169,97,.15);border-radius:24px;padding:36px 28px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;overflow:hidden}
.form-card::before{content:'';position:absolute;top:0;right:15%;left:15%;height:1px;background:linear-gradient(90deg,transparent,var(--gb),transparent);opacity:.5}
.form-title{font-size:22px;font-weight:400;color:var(--tx);text-align:center;margin-bottom:6px;letter-spacing:.02em}
.form-sub{font-size:12px;color:var(--td);text-align:center;margin-bottom:28px;line-height:1.6}

.field{margin-bottom:16px}
.field label{display:block;font-size:10px;letter-spacing:.2em;color:var(--tm);text-transform:uppercase;font-weight:500;margin-bottom:8px;padding-right:4px}
.field input{width:100%;padding:16px 18px;border-radius:14px;background:rgba(8,9,14,.6);border:1px solid rgba(255,255,255,.06);color:var(--tx);font-size:15px;font-family:inherit;outline:none;transition:all .3s ease;text-align:right}
.field input::placeholder{color:var(--tm)}
.field input:focus{border-color:rgba(201,169,97,.5);background:rgba(201,169,97,.04);box-shadow:0 0 0 4px rgba(201,169,97,.06)}

.field-pass{position:relative}
.field-pass input{padding-left:48px}
.pass-toggle{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--td);cursor:pointer;padding:6px;display:flex;align-items:center}
.pass-toggle:active{color:var(--gb)}

.btn-login{width:100%;padding:17px 24px;border-radius:99px;background:linear-gradient(135deg,var(--gb),var(--gold),var(--copper));color:#08090E;font-weight:600;font-size:15px;border:none;cursor:pointer;font-family:inherit;letter-spacing:.03em;margin-top:8px;box-shadow:0 12px 32px -8px rgba(201,169,97,.55);transition:all .3s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.btn-login:active{transform:scale(.97);box-shadow:0 8px 24px -8px rgba(201,169,97,.7)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.btn-login::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-100%);transition:transform .8s}
.btn-login:not(:disabled):hover::after{transform:translateX(100%)}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(8,9,14,.2);border-top-color:#08090E;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}

.hint{text-align:center;font-size:11px;color:var(--tm);margin-top:20px;line-height:1.7;padding:0 8px}
.hint strong{color:var(--gb);font-weight:500}
.hint code{background:rgba(201,169,97,.08);padding:2px 6px;border-radius:4px;color:var(--gb);font-family:'Inter';font-size:10px;letter-spacing:.05em}

.error{background:rgba(240,160,176,.1);border:1px solid rgba(240,160,176,.25);border-radius:12px;padding:12px 16px;color:var(--rose);font-size:12px;text-align:center;margin-bottom:16px;display:none;animation:shake .4s}
.error.show{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Success state */
.success-view{display:none;text-align:center;padding:20px 0}
.success-view.show{display:block;animation:pageIn .6s}
.success-icon{width:80px;height:80px;margin:0 auto 24px;border-radius:50%;background:linear-gradient(135deg,rgba(110,231,160,.15),rgba(110,231,160,.03));border:1px solid rgba(110,231,160,.3);display:flex;align-items:center;justify-content:center;color:var(--em);box-shadow:0 0 40px rgba(110,231,160,.3);animation:pop .6s cubic-bezier(.16,1.5,.3,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.success-title{font-size:20px;color:var(--gb);font-weight:400;margin-bottom:8px}
.success-sub{font-size:12px;color:var(--td)}

.footer{text-align:center;margin-top:32px;font-size:10px;color:var(--tm);letter-spacing:.25em;text-transform:uppercase}
</style>
</head>
<body>

<div class="aura"></div>
<div class="grain"></div>

<div class="wrap">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18M5 8l7-5 7 5M5 8l-2 8h4zM19 8l2 8h-4z"/>
      </svg>
    </div>
    <div class="logo-brand">MIZAN</div>
    <div class="logo-sub">Executive Procurement</div>
  </div>

  <div class="form-card" id="formCard">
    <div id="formView">
      <h1 class="form-title">أهلاً بعودتك</h1>
      <p class="form-sub">أدخل بياناتك للمتابعة إلى النظام</p>

      <div class="error" id="errMsg">⚠️ بيانات غير صحيحة — حاول مرة أخرى</div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label>اسم المستخدم</label>
          <input type="text" id="username" placeholder="admin" autocomplete="username" inputmode="text">
        </div>

        <div class="field field-pass">
          <label>كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••" autocomplete="current-password">
          <button type="button" class="pass-toggle" id="passToggle" aria-label="إظهار كلمة المرور">
            <svg id="eyeOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeOff" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">دخول</button>
      </form>

      <p class="hint">للتجربة، استخدم أي اسم مستخدم<br>وكلمة مرور <code>mizan</code></p>
    </div>

    <div class="success-view" id="successView">
      <div class="success-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 class="success-title">أهلاً بعودتك</h2>
      <p class="success-sub">جاري تحضير لوحة التحكم...</p>
    </div>
  </div>

  <p class="footer">MIZAN · v1.0</p>
</div>

<script>
(function(){
'use strict';

/* ============ AUTH ============ */
var AUTH_KEY='mzn_auth';
var AUTH_TIME='mzn_auth_time';
var DEMO_PASS='mizan';

/* If already logged in, redirect instantly */
try{
  var existing=localStorage.getItem(AUTH_KEY);
  if(existing){
    window.location.replace('index.html');
    return;
  }
}catch(e){}

/* ============ AUDIO ============ */
var audioCtx;
function initAudio(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
}
function tone(f,d,v){
  initAudio();
  if(!audioCtx) return;
  try{
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type='sine';
    o.frequency.value=f;
    d=d||.1;
    g.gain.setValueAtTime(0,audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(v||.06,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function successChime(){
  tone(659,.12);
  setTimeout(function(){tone(880,.15)},90);
  setTimeout(function(){tone(1174,.22)},200);
}
function errorBuzz(){
  tone(220,.15,'triangle',.08);
  setTimeout(function(){tone(180,.2,'triangle',.08)},120);
}

/* ============ ELEMENTS ============ */
var form=document.getElementById('loginForm');
var btn=document.getElementById('loginBtn');
var userInp=document.getElementById('username');
var passInp=document.getElementById('password');
var errMsg=document.getElementById('errMsg');
var passToggle=document.getElementById('passToggle');
var eyeOn=document.getElementById('eyeOn');
var eyeOff=document.getElementById('eyeOff');
var formView=document.getElementById('formView');
var successView=document.getElementById('successView');

/* ============ PASSWORD TOGGLE ============ */
passToggle.addEventListener('click', function(e){
  e.preventDefault();
  tone(660,.05,.03);
  if(passInp.type==='password'){
    passInp.type='text';
    eyeOn.style.display='none';
    eyeOff.style.display='block';
  } else {
    passInp.type='password';
    eyeOn.style.display='block';
    eyeOff.style.display='none';
  }
});

/* ============ FORM SUBMIT ============ */
form.addEventListener('submit', function(e){
  e.preventDefault();
  errMsg.classList.remove('show');

  var u=userInp.value.trim();
  var p=passInp.value;

  if(!u || u.length<2){
    errMsg.textContent='⚠️ اسم المستخدم قصير جداً';
    errMsg.classList.add('show');
    errorBuzz();
    if(navigator.vibrate) navigator.vibrate(30);
    return;
  }
  if(!p || p.length<3){
    errMsg.textContent='⚠️ كلمة المرور قصيرة جداً';
    errMsg.classList.add('show');
    errorBuzz();
    if(navigator.vibrate) navigator.vibrate(30);
    return;
  }

  /* Demo: password must be "mizan" — يمكن تغييره لاحقاً */
  if(p.toLowerCase()!==DEMO_PASS){
    errMsg.textContent='⚠️ كلمة المرور غير صحيحة. جرّب "mizan"';
    errMsg.classList.add('show');
    errorBuzz();
    if(navigator.vibrate) navigator.vibrate(60);
    passInp.value='';
    passInp.focus();
    return;
  }

  /* Success */
  btn.disabled=true;
  btn.innerHTML='دخول<span class="spinner"></span>';
  successChime();
  if(navigator.vibrate) navigator.vibrate([30,50,30]);

  try{
    localStorage.setItem(AUTH_KEY, u);
    localStorage.setItem(AUTH_TIME, new Date().toISOString());
  }catch(e){}

  /* Show success animation briefly */
  setTimeout(function(){
    formView.style.display='none';
    successView.classList.add('show');
  }, 400);

  /* Redirect */
  setTimeout(function(){
    window.location.replace('index.html');
  }, 1600);
});

/* Input: clear error on typing */
userInp.addEventListener('input', function(){ errMsg.classList.remove('show'); });
passInp.addEventListener('input', function(){ errMsg.classList.remove('show'); });

/* Focus first field */
setTimeout(function(){ userInp.focus(); }, 300);

/* Init audio on first touch */
document.body.addEventListener('touchstart', initAudio, {once:true, passive:true});
document.body.addEventListener('click', initAudio, {once:true});

/* Welcome chime */
setTimeout(function(){tone(523,.12,.03)}, 500);
setTimeout(function(){tone(659,.15,.03)}, 700);

})();
</script>
</body>
</html>
