<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIZAN · ميزان</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1A;
    --surface: #141A28;
    --gold: #C9A961;
    --gold-bright: #E5C77E;
    --copper: #B87333;
    --ice: #7DD3FC;
    --text: #F5F5F0;
    --text-dim: #8B93A7;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
    overflow: hidden;
  }
  .bg-orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .bg-orbs::before, .bg-orbs::after {
    content: ''; position: absolute; width: 60vw; height: 60vw;
    border-radius: 50%; filter: blur(120px); opacity: 0.15;
  }
  .bg-orbs::before {
    background: radial-gradient(circle, var(--gold), transparent 70%);
    top: -20%; right: -10%;
    animation: float1 20s ease-in-out infinite;
  }
  .bg-orbs::after {
    background: radial-gradient(circle, var(--ice), transparent 70%);
    bottom: -20%; left: -10%;
    animation: float2 25s ease-in-out infinite;
  }
  @keyframes float1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-5%,5%) scale(1.1); }
  }
  @keyframes float2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(5%,-5%) scale(1.15); }
  }
  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .main-orb {
    width: min(420px, 85vw); height: min(420px, 85vw); border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #1E2740 0%, #0F1420 60%, #0A0E1A 100%);
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,0.8),
      0 0 0 1px rgba(201,169,97,0.08),
      inset 0 0 80px rgba(201,169,97,0.04),
      inset 0 2px 0 rgba(255,255,255,0.04);
    position: relative;
    animation: orbIn 1.2s cubic-bezier(0.16,1,0.3,1);
  }
  .main-orb::before {
    content: ''; position: absolute; inset: -1px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, rgba(201,169,97,0.35), transparent 30%);
    animation: rotate 8s linear infinite; opacity: 0.4; z-index: -1;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes orbIn {
    from { opacity: 0; transform: scale(0.8) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .neu-input {
    width: 100%; padding: 14px 22px; border-radius: 999px;
    background: #0F1420; border: none; color: var(--text);
    font-size: 15px; font-family: inherit; outline: none;
    transition: all 0.3s ease;
    box-shadow:
      inset 4px 4px 10px rgba(0,0,0,0.7),
      inset -4px -4px 10px rgba(255,255,255,0.02);
  }
  .neu-input::placeholder { color: #4A5266; }
  .neu-input:focus {
    box-shadow:
      inset 4px 4px 10px rgba(0,0,0,0.7),
      inset -4px -4px 10px rgba(255,255,255,0.02),
      0 0 0 1px rgba(201,169,97,0.4),
      0 0 20px rgba(201,169,97,0.15);
  }
  .btn-gold {
    width: 100%; padding: 14px 22px; border-radius: 999px;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--copper));
    color: #0A0E1A; font-weight: 600; font-size: 15px;
    letter-spacing: 0.02em; border: none; cursor: pointer;
    position: relative; overflow: hidden;
    transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
    box-shadow:
      0 10px 30px -8px rgba(201,169,97,0.5),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .btn-gold:hover {
    transform: translateY(-2px);
    box-shadow:
      0 15px 40px -8px rgba(201,169,97,0.7),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .btn-gold:active { transform: translateY(0); }
  .btn-gold::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: translateX(-100%); transition: transform 0.6s ease;
  }
  .btn-gold:hover::after { transform: translateX(100%); }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--surface); border: none;
    color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.4), -4px -4px 10px rgba(255,255,255,0.02);
  }
  .icon-btn:hover {
    color: var(--gold);
    box-shadow:
      4px 4px 10px rgba(0,0,0,0.4),
      -4px -4px 10px rgba(255,255,255,0.02),
      0 0 15px rgba(201,169,97,0.2);
  }
  .brand-mark {
    font-size: 11px; letter-spacing: 0.5em;
    color: var(--gold); font-weight: 400; text-align: center; opacity: 0.9;
  }
  .brand-title {
    font-size: 42px; font-weight: 300; letter-spacing: 0.15em; text-align: center;
    background: linear-gradient(180deg, #F5F5F0 0%, #8B93A7 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; margin-top: 8px;
  }
  .glow-line {
    width: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 12px auto;
  }
  .fade-up { opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .delay-1 { animation-delay: 0.2s; }
  .delay-2 { animation-delay: 0.4s; }
  .delay-4 { animation-delay: 0.8s; }
  .success-view {
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
  }
  .check-circle {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    display: flex; align-items: center; justify-content: center;
    animation: checkIn 0.5s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 0 40px rgba(201,169,97,0.5);
  }
  @keyframes checkIn { from { transform: scale(0); } to { transform: scale(1); } }
</style>
</head>
<body class="min-h-screen flex items-center justify-center relative">

  <div class="bg-orbs"></div>
  <div class="grain"></div>

  <div class="fixed top-0 left-0 right-0 z-20 p-6 flex justify-between items-center fade-up">
    <button class="icon-btn" id="soundToggle" title="تفعيل الصوت">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    </button>
    <button class="icon-btn" id="langToggle" title="English">
      <span style="font-size: 13px; font-weight: 600;">EN</span>
    </button>
  </div>

  <div class="relative z-10 flex flex-col items-center">
    <div class="mb-8 text-center fade-up delay-1">
      <div class="brand-mark">EXECUTIVE PROCUREMENT</div>
      <h1 class="brand-title">MIZAN</h1>
      <div class="glow-line"></div>
      <p style="color: var(--text-dim); font-size: 13px; letter-spacing: 0.2em;">مــيــزان</p>
    </div>

    <div class="main-orb flex items-center justify-center fade-up delay-2">
      <div class="w-full px-12 text-center">
        <div id="formView">
          <h2 style="font-size: 22px; font-weight: 500; letter-spacing: 0.1em; margin-bottom: 4px;">SIGN IN</h2>
          <p style="color: var(--text-dim); font-size: 12px; margin-bottom: 28px;">Welcome back</p>
          <div class="space-y-4">
            <input type="text" class="neu-input text-center" placeholder="اسم المستخدم" id="username">
            <input type="password" class="neu-input text-center" placeholder="كلمة المرور" id="password">
            <button class="btn-gold" onclick="handleLogin()">دخول</button>
          </div>
        </div>

        <div id="successView" class="success-view">
          <div class="check-circle">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0A0E1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <h2 style="font-size: 20px; font-weight: 500; color: var(--gold-bright);">أهلاً بعودتك</h2>
          <p style="color: var(--text-dim); font-size: 13px;">جاري تحضير لوحة التحكم...</p>
        </div>
      </div>
    </div>

    <div class="mt-8 text-center fade-up delay-4">
      <p style="color: var(--text-dim); font-size: 11px; letter-spacing: 0.15em;">POWERED BY AI · v1.0</p>
    </div>
  </div>

  <script>
    let soundOn = true;
    let audioCtx;

    function playTone(freq, duration) {
      if (!soundOn) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    document.getElementById('soundToggle').addEventListener('click', function() {
      soundOn = !soundOn;
      this.style.color = soundOn ? 'var(--gold)' : 'var(--text-dim)';
      playTone(soundOn ? 660 : 440, 0.1);
    });

    document.getElementById('langToggle').addEventListener('click', function() {
      playTone(520, 0.08);
    });

    function handleLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (!u || !p) { playTone(220, 0.2); return; }
      playTone(660, 0.1);
      setTimeout(() => playTone(880, 0.15), 100);
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'flex';
    }

    window.addEventListener('load', () => {
      setTimeout(() => playTone(440, 0.15), 800);
      setTimeout(() => playTone(660, 0.2), 1000);
    });
  </script>
</body>
</html>
