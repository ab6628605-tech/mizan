<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>MIZAN · طلب عرض سعر RFQ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<style>
:root{--bg:#08090E;--gold:#C9A961;--gb:#E8CE8B;--copper:#B87333;--ice:#9DC4E8;--em:#6EE7A0;--am:#F0C474;--rose:#F0A0B0;--vi:#B8A5E8;--tx:#EDEDED;--td:#7A8090;--tm:#4A5060;--ln:rgb(var(--w) / calc(.05 * var(--wk)))}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:300;min-height:100vh;position:relative;overflow-x:hidden}
.aura{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(201,169,97,.1),transparent 60%),radial-gradient(ellipse 60% 40% at 100% 100%,rgb(var(--info-a) / .05),transparent 60%)}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 130px;position:relative;z-index:2}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.logo-text{font-family:'Inter',sans-serif;font-size:13px;letter-spacing:.35em;color:var(--gb);font-weight:400}
.tag{font-size:11px;color:var(--tm);letter-spacing:.2em;text-transform:uppercase}
h1{font-family:'Inter',sans-serif;font-weight:200;font-size:clamp(30px,6vw,44px);letter-spacing:-.03em;line-height:1.1;margin-bottom:12px;background:linear-gradient(180deg,var(--h1a),var(--h1b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1 span{color:var(--gb);-webkit-text-fill-color:var(--gb)}
.sub{font-size:13px;color:var(--td);line-height:1.9;margin-bottom:32px}

.rfq-header{background:linear-gradient(160deg,rgba(201,169,97,.05),rgba(201,169,97,.01));border:1px solid rgba(201,169,97,.2);border-radius:20px;padding:24px;margin-bottom:24px;display:flex;gap:20px;align-items:flex-start}
.rfq-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,rgba(201,169,97,.15),rgba(201,169,97,.03));border:1px solid rgba(201,169,97,.25);display:flex;align-items:center;justify-content:center;color:var(--gb);flex-shrink:0}
.rfq-logo svg{width:28px;height:28px}
.rfq-company{flex:1;min-width:0}
.rfq-company h2{font-size:16px;color:var(--gb);font-weight:500;margin-bottom:6px}
.rfq-company p{font-size:12px;color:var(--td);line-height:1.7}
.rfq-meta{text-align:left;flex-shrink:0}
.rfq-meta .code{font-family:Inter;font-size:13px;color:var(--gb);letter-spacing:.05em;margin-bottom:4px;font-weight:500}
.rfq-meta .date{font-family:Inter;font-size:11px;color:var(--td)}
@media(max-width:600px){.rfq-header{flex-direction:column}.rfq-meta{text-align:right;width:100%;padding-top:14px;border-top:1px solid rgba(201,169,97,.15)}}

.section{background:linear-gradient(160deg,rgb(var(--w) / calc(.025 * var(--wk))),rgb(var(--w) / calc(.005 * var(--wk))));border:1px solid var(--ln);border-radius:20px;padding:24px;margin-bottom:20px}
.section-title{font-size:11px;letter-spacing:.25em;color:var(--tm);text-transform:uppercase;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title svg{width:14px;height:14px;color:var(--gb)}

.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.15em;color:var(--tm);text-transform:uppercase;font-weight:500;margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;padding:12px 16px;border-radius:12px;background:rgb(var(--ov) / calc(.3 * var(--ovk)));border:1px solid rgb(var(--w) / calc(.06 * var(--wk)));color:var(--tx);font-size:13.5px;font-family:inherit;outline:none;transition:all .3s ease}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(201,169,97,.5);background:rgba(201,169,97,.03)}
.field textarea{min-height:80px;resize:vertical;line-height:1.7}
.field input::placeholder,.field textarea::placeholder{color:var(--tm)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row2{grid-template-columns:1fr}}

.items-table{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.item-row{display:grid;grid-template-columns:36px 2fr 2fr 80px 90px 2fr 36px;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgb(var(--w) / calc(.02 * var(--wk)));border:1px solid var(--ln);animation:slideIn .3s}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.item-num{font-family:Inter;font-size:12px;color:var(--tm);text-align:center}
.item-row input,.item-row select{padding:10px 12px;border-radius:8px;background:rgb(var(--ov) / calc(.3 * var(--ovk)));border:1px solid rgb(var(--w) / calc(.06 * var(--wk)));color:var(--tx);font-size:12.5px;font-family:inherit;outline:none;width:100%}
.item-row input:focus,.item-row select:focus{border-color:rgba(201,169,97,.5);background:rgba(201,169,97,.03)}
.item-remove{width:36px;height:36px;border-radius:8px;background:rgb(var(--bad-a) / .08);border:1px solid rgb(var(--bad-a) / .2);color:var(--rose);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.item-remove:active{background:rgb(var(--bad-a) / .2)}
.item-remove svg{width:12px;height:12px;pointer-events:none}
@media(max-width:900px){
.item-row{grid-template-columns:28px 1fr 28px;grid-auto-rows:auto;gap:8px;padding:12px}
.item-row>*:nth-child(2){grid-column:2;grid-row:1}
.item-row>*:nth-child(3){grid-column:2;grid-row:2}
.item-row>*:nth-child(4){grid-column:2;grid-row:3}
.item-row>*:nth-child(5){grid-column:2;grid-row:4}
.item-row>*:nth-child(6){grid-column:2;grid-row:5}
.item-row>*:nth-child(7){grid-column:3;grid-row:1}
.item-num{grid-column:1!important;grid-row:1!important;justify-self:center}
.item-row input::placeholder{font-size:11px}
}

.suppliers-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.supplier-row{display:grid;grid-template-columns:36px 1.5fr 1fr 1.5fr 36px;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgb(var(--w) / calc(.02 * var(--wk)));border:1px solid var(--ln);animation:slideIn .3s}
.supplier-row input{padding:10px 12px;border-radius:8px;background:rgb(var(--ov) / calc(.3 * var(--ovk)));border:1px solid rgb(var(--w) / calc(.06 * var(--wk)));color:var(--tx);font-size:12.5px;font-family:inherit;outline:none;width:100%}
.supplier-row input:focus{border-color:rgba(201,169,97,.5);background:rgba(201,169,97,.03)}
.supplier-num{font-family:Inter;font-size:12px;color:var(--tm);text-align:center}
.supplier-remove{width:36px;height:36px;border-radius:8px;background:rgb(var(--bad-a) / .08);border:1px solid rgb(var(--bad-a) / .2);color:var(--rose);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
.supplier-remove:active{background:rgb(var(--bad-a) / .2)}
.supplier-remove svg{width:12px;height:12px;pointer-events:none}
@media(max-width:900px){
.supplier-row{grid-template-columns:28px 1fr 28px;grid-auto-rows:auto;gap:8px;padding:12px}
.supplier-row>*:nth-child(2){grid-column:2;grid-row:1}
.supplier-row>*:nth-child(3){grid-column:2;grid-row:2}
.supplier-row>*:nth-child(4){grid-column:2;grid-row:3}
.supplier-row>*:nth-child(5){grid-column:3;grid-row:1}
.supplier-num{grid-column:1!important;grid-row:1!important;justify-self:center}
}

.btn-add{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:99px;background:rgba(201,169,97,.08);border:1px solid rgba(201,169,97,.25);color:var(--gb);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .25s}
.btn-add:active{background:rgba(201,169,97,.15)}
.btn-add svg{width:12px;height:12px;pointer-events:none}

.btn-primary{width:100%;padding:16px;border-radius:99px;background:var(--grad3);color:var(--btn-ink);font-weight:600;font-size:14px;border:none;cursor:pointer;font-family:inherit;box-shadow:0 12px 32px -8px rgba(201,169,97,.5);transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-primary svg{width:14px;height:14px}
.btn-primary .spin{width:14px;height:14px;border:2px solid rgba(8,9,14,.3);border-top-color:#08090E;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.btn-secondary{width:100%;padding:14px;border-radius:99px;background:transparent;border:1px solid rgba(201,169,97,.3);color:var(--gb);font-weight:500;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-secondary:active{background:rgba(201,169,97,.08)}
.btn-secondary svg{width:14px;height:14px}

.file-upload{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;border:1px dashed rgba(201,169,97,.3);background:rgba(201,169,97,.02);cursor:pointer;transition:all .25s}
.file-upload:active{background:rgba(201,169,97,.06)}
.file-upload svg{width:18px;height:18px;color:var(--gb);flex-shrink:0}
.file-upload-text{flex:1;font-size:13px;color:var(--td)}
.file-upload-text strong{color:var(--gb);font-weight:500}
.file-upload input{display:none}

.files-chosen{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.chosen-file{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:rgb(var(--ok-a) / .06);border:1px solid rgb(var(--ok-a) / .2);font-size:12.5px;color:var(--em)}
.chosen-file svg{width:12px;height:12px;flex-shrink:0}
.chosen-file .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chosen-file .size{font-family:Inter;font-size:10.5px;color:var(--td);flex-shrink:0}

footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--tm);letter-spacing:.15em;text-transform:uppercase}
.toast-wrap{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;max-width:90vw}
</style>
</head>
<body>

<div class="aura"></div>
<div class="toast-wrap" id="mznToastWrap"></div>

<div class="wrap">
<header>
<div class="logo-text">MIZAN</div>
<div class="tag">RFQ</div>
</header>

<h1>طلب عرض سعر جديد.<br><span>احترافي ومتكامل.</span></h1>
<p class="sub">أنشئ RFQ رسمي، أضف الأصناف والموردين، ثم أرسله. سيُحفظ تلقائياً في السحابة.</p>

<div class="rfq-header" id="mznRfqHeader">
  <div class="rfq-logo" id="mznRfqLogo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 8l7-5 7 5M5 8l-2 8h4zM19 8l2 8h-4z"/></svg>
  </div>
  <div class="rfq-company">
    <h2 id="mznRfqCompany">—</h2>
    <p id="mznRfqAddress">—</p>
    <p id="mznRfqContact">—</p>
  </div>
  <div class="rfq-meta">
    <div class="code" id="mznRfqCode">RFQ-...</div>
    <div class="date" id="mznRfqDate">—</div>
  </div>
</div>

<section class="section">
  <div class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    المعلومات الأساسية
  </div>

  <div class="field">
    <label>عنوان RFQ</label>
    <input type="text" id="mznTitle" placeholder="مثال: توريد أجهزة شبكات — الدفعة الرابعة">
  </div>

  <div class="row2">
    <div class="field">
      <label>القسم الطالب</label>
      <select id="mznDept">
        <option>تقنية المعلومات</option>
        <option>العمليات</option>
        <option>المالية</option>
        <option>الموارد البشرية</option>
        <option>التسويق</option>
        <option>الإدارة العامة</option>
      </select>
    </div>
    <div class="field">
      <label>تاريخ الاستحقاق</label>
      <input type="date" id="mznDueDate">
    </div>
  </div>

  <div class="row2">
    <div class="field">
      <label>Incoterms 2020</label>
      <select id="mznIncoterms">
        <option value="EXW">EXW — Ex Works</option>
        <option value="FCA">FCA — Free Carrier</option>
        <option value="FAS">FAS — Free Alongside Ship</option>
        <option value="FOB" selected>FOB — Free On Board</option>
        <option value="CFR">CFR — Cost and Freight</option>
        <option value="CIF">CIF — Cost, Insurance, Freight</option>
        <option value="CPT">CPT — Carriage Paid To</option>
        <option value="CIP">CIP — Carriage & Insurance Paid</option>
        <option value="DAP">DAP — Delivered At Place</option>
        <option value="DPU">DPU — Delivered Place Unloaded</option>
        <option value="DDP">DDP — Delivered Duty Paid</option>
      </select>
    </div>
    <div class="field">
      <label>العملة</label>
      <select id="mznCurrency">
        <option value="USD" selected>USD — دولار أمريكي</option>
        <option value="EUR">EUR — يورو</option>
        <option value="JOD">JOD — دينار أردني</option>
        <option value="SAR">SAR — ريال سعودي</option>
        <option value="AED">AED — درهم إماراتي</option>
      </select>
    </div>
  </div>
</section>

<section class="section">
  <div class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    الأصناف المطلوبة
  </div>

  <div class="items-table" id="mznItemsTable"></div>

  <button type="button" class="btn-add" id="mznAddItem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    إضافة صنف
  </button>
</section>

<section class="section">
  <div class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    الموردون المرسل إليهم
  </div>

  <div class="suppliers-list" id="mznSuppliersList"></div>

  <button type="button" class="btn-add" id="mznAddSupplier">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    إضافة مورد
  </button>
</section>

<section class="section">
  <div class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    مرفقات (ملفات RFQ جاهزة)
  </div>

  <label class="file-upload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span class="file-upload-text">اضغط لاختيار <strong>ملفات PDF / Word / Excel</strong></span>
    <input type="file" id="mznFilesInput" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.csv">
  </label>
  <div class="files-chosen" id="mznFilesChosen"></div>
</section>

<section class="section">
  <div class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    ملاحظات
  </div>

  <div class="field">
    <textarea id="mznNotes" placeholder="أي شروط خاصة، متطلبات، أو ملاحظات إضافية..."></textarea>
  </div>
</section>

<section style="margin-top:32px">
  <button type="button" class="btn-primary" id="mznSaveBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    حفظ RFQ في السحابة
  </button>
  <button type="button" class="btn-secondary" id="mznPreviewBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    معاينة RFQ
  </button>
</section>

<footer>
<div>MIZAN · RFQ</div>
<div id="mznFooterStatus">جاهز</div>
</footer>
</div>

<script>
(function(){
'use strict';

/* ============ TOAST ============ */
function toast(m, t){
  var wrap=document.getElementById('mznToastWrap');
  if(!wrap) return;
  var colors={info:'#9DC4E8', success:'#6EE7A0', warning:'#F0C474', danger:'#F0A0B0'};
  var color=colors[t]||colors.info;
  var el=document.createElement('div');
  el.style.cssText='padding:12px 22px;border-radius:99px;background:rgb(var(--surface-rgb) / .95);backdrop-filter:blur(20px);border:1px solid rgba(201,169,97,.25);color:var(--tx);font-family:inherit;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 20px 50px rgb(var(--sh) / calc(.6 * var(--shk)));max-width:90vw;animation:mznTIn .4s';
  el.innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:'+color+';box-shadow:0 0 8px '+color+';flex-shrink:0"></span><span>'+m+'</span>';
  var style=document.getElementById('mznToastAnim');
  if(!style){
    style=document.createElement('style');
    style.id='mznToastAnim';
    style.textContent='@keyframes mznTIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}';
    document.head.appendChild(style);
  }
  wrap.appendChild(el);
  setTimeout(function(){
    el.style.opacity='0';
    el.style.transform='translateY(-20px)';
    el.style.transition='all .4s ease';
    setTimeout(function(){ el.remove(); }, 400);
  }, 3200);
}

/* ============ AUDIO ============ */
var audioCtx=null;
function initAudio(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
}
function tone(f,d,v){
  initAudio();
  if(!audioCtx) return;
  try{
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=f; d=d||.1;
    g.gain.setValueAtTime(0,audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(v||.05,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
document.body.addEventListener('touchstart', initAudio, {once:true, passive:true});
document.body.addEventListener('click', initAudio, {once:true});

/* ============ STATE ============ */
var itemCounter=0;
var supplierCounter=0;
var selectedFiles=[];
var nextRFQMeta=null;
var supplierHistory=[];

/* ============ LOAD SETTINGS ============ */
function loadSettings(){
  var defaults={

    address:'Amman - Summaya Str. No. 2008',
    phone:'+962781626866',
    email:'saidd.nofal@gmail.com',

/* ============ DISPLAY COMPANY ============ */
function displayCompany(){
  var s=loadSettings();
  var cEl=document.getElementById('mznRfqCompany');
  var aEl=document.getElementById('mznRfqAddress');
  var tEl=document.getElementById('mznRfqContact');
  if(cEl) cEl.textContent=s.company || '—';
  if(aEl) aEl.textContent=s.address || '—';
  if(tEl){
    var parts=[];
    if(s.phone) parts.push(s.phone);
    if(s.email) parts.push(s.email);
    tEl.textContent=parts.join(' · ') || '—';
  }
}

/* ============ DATE HELPERS ============ */
function getMonthAbbr(){
  var d=new Date();
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[d.getMonth()];
}
function getFullDate(){
  var d=new Date();
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function displayDate(){
  var e=document.getElementById('mznRfqDate');
  if(e) e.textContent=getFullDate();
}

/* ============ GET NEXT RFQ CODE ============ */
async function getNextRFQCode(){
  var year=new Date().getFullYear();
  var month=getMonthAbbr();
  var maxNum=0;

  /* Try cloud first */
  if(window.MZN_DB){
    try{
      var items=await window.MZN_DB.list('rfqs');
      (items||[]).forEach(function(r){
        if(r.seq_year===year && r.seq_number && r.seq_number>maxNum) maxNum=r.seq_number;
      });
    }catch(e){ console.warn('[MIZAN] Could not fetch from cloud', e); }
  }

  /* Fallback to local */
  if(maxNum===0){
    try{ maxNum=parseInt(localStorage.getItem('mzn_rfq_last_'+year)||'0'); }catch(e){}
  }

  var next=maxNum+1;

  return {
    code: 'RFQ-'+year+'-'+month+'-'+String(next).padStart(5,'0'),
    seq_year: year,
    seq_month: month,
    seq_number: next
  };
}

function displayCode(meta){
  var e=document.getElementById('mznRfqCode');
  if(e) e.textContent=meta.code;
}

/* ============ SUPPLIERS ============ */
function loadSupplierHistory(){
  try{
    var raw=localStorage.getItem('mzn_suppliers_history');
    supplierHistory=raw ? JSON.parse(raw) : [];
    if(!Array.isArray(supplierHistory)) supplierHistory=[];
  }catch(e){ supplierHistory=[]; }
}
function saveSupplierToHistory(s){
  if(!s || !s.name) return;
  var exists=supplierHistory.some(function(x){
    return (x.name||'').toLowerCase()===(s.name||'').toLowerCase();
  });
  if(!exists){
    supplierHistory.push({
      name: s.name,
      cr: s.cr || '',
      email: s.email || '',
      added: new Date().toISOString()
    });
    try{ localStorage.setItem('mzn_suppliers_history', JSON.stringify(supplierHistory)); }catch(e){}
  }
}

/* ============ FILES ============ */
function formatBytes(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(2)+' MB';
}
function renderFiles(){
  var container=document.getElementById('mznFilesChosen');
  if(!container) return;
  container.innerHTML='';
  selectedFiles.forEach(function(f, i){
    var div=document.createElement('div');
    div.className='chosen-file';
    div.innerHTML=
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'+
      '<span class="name">'+escapeHTML(f.name)+'</span>'+
      '<span class="size">'+formatBytes(f.size)+'</span>'+
      '<button type="button" style="background:transparent;border:none;color:inherit;cursor:pointer;padding:2px 6px;font-family:inherit" data-idx="'+i+'">✕</button>';
    div.querySelector('button').addEventListener('click', function(e){
      e.stopPropagation();
      tone(500,.06);
      selectedFiles.splice(i, 1);
      renderFiles();
    });
    container.appendChild(div);
  });
}

/* ============ HELPERS ============ */
function escapeHTML(s){
  return String(s||'').replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s){
  return escapeHTML(s).replace(/\n/g,' ');
}

/* ============ COLLECT FORM DATA ============ */
function collectFormData(){
  var items=[];
  document.querySelectorAll('#mznItemsTable .item-row').forEach(function(r){
    var name=r.querySelector('.it-name');
    var specs=r.querySelector('.it-specs');
    var qty=r.querySelector('.it-qty');
    var unit=r.querySelector('.it-unit');
    var notes=r.querySelector('.it-notes');
    if(name && name.value.trim()){
      items.push({
        name: name.value.trim(),
        specs: specs ? specs.value.trim() : '',
        qty: qty ? (parseFloat(qty.value)||1) : 1,
        unit: unit ? unit.value : 'قطعة',
        notes: notes ? notes.value.trim() : ''
      });
    }
  });

  var suppliers=[];
  document.querySelectorAll('#mznSuppliersList .supplier-row').forEach(function(r){
    var name=r.querySelector('.sup-name');
    var cr=r.querySelector('.sup-cr');
    var email=r.querySelector('.sup-email');
    if(name && name.value.trim()){
      var s={
        name: name.value.trim(),
        cr: cr ? cr.value.trim() : '',
        email: email ? email.value.trim() : ''
      };
      suppliers.push(s);
      saveSupplierToHistory(s);
    }
  });

  return {
    title: (document.getElementById('mznTitle').value||'').trim(),
    department: document.getElementById('mznDept').value,
    due_date: document.getElementById('mznDueDate').value,
    incoterms: document.getElementById('mznIncoterms').value,
    currency: document.getElementById('mznCurrency').value,
    items: items,
    suppliers: suppliers,
    notes: (document.getElementById('mznNotes').value||'').trim()
  };
}

/* ============ VALIDATION ============ */
function validate(data){
  var errors=[];
  if(!data.title) errors.push('عنوان RFQ مطلوب');
  if(!data.items || !data.items.length) errors.push('يجب إضافة صنف واحد على الأقل');
  if(!data.suppliers || !data.suppliers.length) errors.push('يجب إضافة مورد واحد على الأقل');
  return errors;
}

/* ============ SAVE RFQ ============ */
async function saveRFQ(){
  var btn=document.getElementById('mznSaveBtn');
  if(btn.disabled) return;

  var data=collectFormData();
  var errors=validate(data);
  if(errors.length){
    toast('⚠️ '+errors[0], 'warning');
    tone(330,.15);
    return;
  }

  /* Show spinner */
  var originalHTML=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span> جارٍ الحفظ...';

  /* Ensure we have a code */
  if(!nextRFQMeta){
    try{
      nextRFQMeta=await getNextRFQCode();
      displayCode(nextRFQMeta);
    }catch(e){
      btn.disabled=false;
      btn.innerHTML=originalHTML;
      toast('⚠️ تعذّر توليد رقم RFQ','danger');
      return;
    }
  }

  var user='المستخدم';
  try{ user=localStorage.getItem('mzn_auth')||'المستخدم'; }catch(e){}

  var record={
    code: nextRFQMeta.code,
    title: data.title,
    department: data.department,
    due_date: data.due_date,
    incoterms: data.incoterms,
    currency: data.currency,
    items: data.items,
    suppliers: data.suppliers,
    notes: data.notes,
    status: 'draft',
    seq_year: nextRFQMeta.seq_year,
    seq_month: nextRFQMeta.seq_month,
    seq_number: nextRFQMeta.seq_number,
    created_by: user
  };

  /* Save to Supabase */
  if(window.MZN_DB){
    try{
      await window.MZN_DB.create('rfqs', record);

      /* Save local seq counter too */
      try{ localStorage.setItem('mzn_rfq_last_'+record.seq_year, String(record.seq_number)); }catch(e){}

      /* Success */
      btn.disabled=false;
      btn.innerHTML=originalHTML;
      tone(880,.12); setTimeout(function(){ tone(1174,.15); }, 90);
      toast('✅ حُفظ RFQ '+record.code+' في السحابة','success');

      /* Update counter for next RFQ */
      nextRFQMeta=null;

      /* Reset form after 2 seconds */
      setTimeout(function(){
        if(confirm('تم حفظ '+record.code+'. هل تريد إنشاء RFQ جديد؟')){
          location.reload();
        }
      }, 1200);

      return;
    }catch(e){
      console.warn('[MIZAN] Cloud save failed', e);
    }
  }

  /* Fallback: local only */
  try{
    var list=JSON.parse(localStorage.getItem('mzn_rfqs')||'[]');
    list.unshift(record);
    localStorage.setItem('mzn_rfqs', JSON.stringify(list));
    localStorage.setItem('mzn_rfq_last_'+record.seq_year, String(record.seq_number));
    btn.disabled=false;
    btn.innerHTML=originalHTML;
    tone(880,.12);
    toast('⚠️ حُفظ محلياً فقط (تحقق من الإنترنت)','warning');
    nextRFQMeta=null;
  }catch(err){
    btn.disabled=false;
    btn.innerHTML=originalHTML;
    tone(330,.2);
    toast('❌ فشل الحفظ','danger');
  }
}

/* ============ INIT ============ */
async function init(){
  /* Display company + date */
  displayCompany();
  displayDate();

  /* Load supplier history */
  loadSupplierHistory();

  /* Generate RFQ code */
  try{
    nextRFQMeta=await getNextRFQCode();
    displayCode(nextRFQMeta);
  }catch(e){
    var eEl=document.getElementById('mznRfqCode');
    if(eEl) eEl.textContent='RFQ-خطأ';
  }

  /* Add first item + supplier rows */
  addItemRow();
  addSupplierRow();

  /* Bind add buttons */
  var addItemBtn=document.getElementById('mznAddItem');
  if(addItemBtn) addItemBtn.addEventListener('click', function(){
    tone(660,.08);
    addItemRow();
  });

  var addSupBtn=document.getElementById('mznAddSupplier');
  if(addSupBtn) addSupBtn.addEventListener('click', function(){
    tone(660,.08);
    addSupplierRow();
  });

  /* Bind file input */
  var fileInput=document.getElementById('mznFilesInput');
  if(fileInput) fileInput.addEventListener('change', function(e){
    if(e.target.files && e.target.files.length){
      Array.from(e.target.files).forEach(function(f){
        selectedFiles.push(f);
      });
      tone(880,.1);
      renderFiles();
      toast('📎 أُضيف '+e.target.files.length+' ملف','info');
      fileInput.value='';
    }
  });

  /* Bind save */
  var saveBtn=document.getElementById('mznSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', saveRFQ);

  /* Bind preview */
  var previewBtn=document.getElementById('mznPreviewBtn');
  if(previewBtn) previewBtn.addEventListener('click', previewRFQ);

  /* Welcome chime */
  setTimeout(function(){ tone(523,.12,.03); }, 400);
  setTimeout(function(){ tone(659,.15,.03); }, 600);

  console.log('[MIZAN] RFQ page ready:', nextRFQMeta ? nextRFQMeta.code : 'no code');
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>

<script src="nav.js"></script>
</body>
</html>
