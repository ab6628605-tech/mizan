<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>MIZAN</title>
<style>
body{margin:0;min-height:100vh;background:#08090E;color:#EDEDED;font-family:sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
h1{font-size:80px;font-weight:200;background:linear-gradient(180deg,#fff,#6A7080);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.04em;margin:0}
p{color:#C9A961;letter-spacing:.3em;font-size:12px;margin-top:16px;text-transform:uppercase}
.box{padding:40px}
.dot{width:10px;height:10px;border-radius:50%;background:#6EE7A0;box-shadow:0 0 12px #6EE7A0;display:inline-block;margin-left:8px;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
</style>
</head>
<body>
<div class="box">
<h1>MIZAN</h1>
<p>Executive Procurement</p>
<p style="margin-top:40px;color:#6EE7A0"><span class="dot"></span> يعمل بنجاح</p>
</div>
</body>
</html>
