<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MIZAN · رفع العروض</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090E;--gold:#C9A961;--gb:#E8CE8B;--ice:#9DC4E8;--em:#6EE7A0;--am:#F0C474;--tx:#EDEDED;--td:#7A8090;--tm:#4A5060;--ln:rgba(255,255,255,.05)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:300;min-height:100vh;position:relative}
.aura{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(201,169,97,.1),transparent 60%)}
.wrap{max-width:800px;margin:0 auto;padding:32px 20px;position:relative;z-index:2}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--td);font-size:13px;text-decoration:none;margin-bottom:32px}
.back:hover{color:var(--gb)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.logo-text{font-family:'Inter',sans-serif;font-size:13px;letter-spacing:.35em;color:var(--gb)}
.tag{font-size:11px;color:var(--tm);letter-spacing:.2em;text-transform:uppercase}
h1{font-family:'Inter',sans-serif;font-weight:200;font-size:clamp(34px,7vw,52px);letter-spacing:-.03em;line-height:1;margin-bottom:12px;background:linear-gradient(180deg,#fff,#6A7080);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1 span{color:var(--gb);-webkit-text-fill-color:var(--gb)}
.sub{font-size:13px;color:var(--td);line-height:1.9;margin-bottom:32px}
.drop{border:1px dashed rgba(201,169,97,.3);border-radius:24px;padding:56px 24px;text-align:center;background:linear-gradient(180deg,rgba(201,169,97,.03),transparent);transition:all .4s ease;cursor:pointer;margin-bottom:24px}
.drop:hover{border-color:var(--gb);background:linear-gradient(180deg,rgba(201,169,97,.06),transparent)}
.drop-icon{width:64px;height:64px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,rgba(201,169,97,.15),rgba(201,169,97,.03));border:1px solid rgba(201,169,97,.25);display:flex;align-items:center;justify-content:center;color:var(--gb)}
.drop-title{font-size:16px;font-weight:400;margin-bottom:6px}
.drop-sub{font-size:12px;color:var(--tm);margin-bottom:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:99px;background:linear-gradient(135deg,var(--gb),var(--gold));color:#08090E;font-weight:600;font-size:13px;border:none;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px -8px rgba(201,169,97,.5)}
.btn:hover{transform:translateY(-2px);box-shadow:0 15px 40px -8px rgba(201,169,97,.7)}
.hint{font-size:11px;color:var(--tm);margin-top:16px}
.samples-title{font-size:11px;letter-spacing:.3em;color:var(--tm);text-transform:uppercase;font-weight:500;text-align:center;margin-bottom:16px}
.samples{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.samples{grid-template-columns:repeat(3,1fr)}}
.sample{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.025),rgba(255,255,255,.005));border:1px solid var(--ln);cursor:pointer;transition:all .3s ease;text-align:right;font-family:inherit;color:var(--tx)}
.sample:hover{border-color:rgba(201,169,97,.3);transform:translateY(-2px)}
.sample-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Inter';font-size:9px;font-weight:700;border:1px solid;flex-shrink:0}
.sample-title{font-size:13px;font-weight:500;margin-bottom:2px}
.sample-meta{font-size:11px;color:var(--tm)}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--tm);letter-spacing:.15em;text-transform:uppercase}
</style>
</head>
<body>
<div class="aura"></div>
<div class="wrap">
<a href="index.html" class="back">→ العودة للرئيسية</a>
<header>
<div class="logo-text">MIZAN</div>
<div class="tag">Upload</div>
</header>
<h1>ارفع العروض.<br><span>وأترك الباقي عليّ.</span></h1>
<p class="sub">أرسل ملفات PDF أو Excel من مورديك. سأستخرج البيانات، أوحّدها، وأجهّزها للمقارنة.</p>
<div class="drop">
<div class="drop-icon">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
</div>
<div class="drop-title">اسحب الملفات هنا</div>
<div class="drop-sub">أو اضغط للاختيار</div>
<button class="btn">اختر ملفات</button>
<div class="hint">PDF · Excel · Word · حتى 25 ميجابايت</div>
</div>
<div class="samples-title">— أو جرّب نموذجاً —</div>
<div class="samples">
<button class="sample">
<div class="sample-icon" style="background:rgba(110,231,160,.1);color:var(--em);border-color:rgba(110,231,160,.25)">PDF</div>
<div><div class="sample-title">STC Solutions</div><div class="sample-meta">24 صنف</div></div>
</button>
<button class="sample">
<div class="sample-icon" style="background:rgba(240,160,176,.1);color:#F0A0B0;border-color:rgba(240,160,176,.25)">XLSX</div>
<div><div class="sample-title">Huawei</div><div class="sample-meta">18 صنف</div></div>
</button>
<button class="sample">
<div class="sample-icon" style="background:rgba(201,169,97,.1);color:var(--gb);border-color:rgba(201,169,97,.25)">PDF</div>
<div><div class="sample-title">Mobily</div><div class="sample-meta">12 صنف</div></div>
</button>
</div>
<footer>
<div>MIZAN · UPLOAD</div>
<div>2025</div>
</footer>
</div>
</body>
</html>
